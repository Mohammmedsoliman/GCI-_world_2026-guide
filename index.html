<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Access Restricted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--bg-body: #fafafa;
--bg-surface: #ffffff;
--text-main: #27272a;
--text-muted: #71717a;
--primary: #0f766e;
--primary-light: #ccfbf1;
--border: #e4e4e7;
--danger: #ef4444;
--danger-light: #fee2e2;
--warning: #f59e0b;
--warning-light: #fef3c7;
--radius: 12px;
--radius-lg: 20px;
--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
--bg-body: #09090b;
--bg-surface: #18181b;
--text-main: #f4f4f5;
--text-muted: #a1a1aa;
--primary: #14b8a6;
--primary-light: rgba(20, 184, 166, 0.15);
--border: #27272a;
--danger-light: rgba(239, 68, 68, 0.15);
--warning-light: rgba(245, 158, 11, 0.15);
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Cairo', sans-serif;
background-color: var(--bg-body);
color: var(--text-main);
line-height: 1.6;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
transition: background-color 0.3s, color 0.3s;
background-image: radial-gradient(var(--border) 1px, transparent 1px);
background-size: 40px 40px;
padding: 20px;
user-select: none;
-webkit-user-select: none;
-moz-user-select: none;
}
.logo-dark { display: none; }
[data-theme="dark"] .logo-light { display: none; }
[data-theme="dark"] .logo-dark { display: block; }
::selection { background-color: var(--primary); color: #ffffff; }
::-moz-selection { background-color: var(--primary); color: #ffffff; }
.theme-toggle-wrapper {
position: absolute;
top: 25px;
right: 25px;
}
.icon-btn {
background: var(--bg-surface);
border: 1px solid var(--border);
color: var(--text-main);
width: 45px;
height: 45px;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.2rem;
transition: all 0.2s;
box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}
.icon-btn:hover {
background: var(--primary-light);
color: var(--primary);
border-color: var(--primary);
transform: translateY(-2px);
}
.auth-card {
background: var(--bg-surface);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
padding: 45px 40px;
width: 100%;
max-width: 480px;
box-shadow: 0 4px 20px rgba(0,0,0,0.03);
text-align: center;
animation: slideUp 0.5s ease;
position: relative;
overflow: hidden;
}
[data-theme="dark"] .auth-card {
background: rgba(30, 41, 59, 0.6);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.08);
box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.auth-card::before {
content: '';
position: absolute;
top: 0; left: 0; width: 100%; height: 5px;
background: linear-gradient(90deg, var(--danger), var(--warning));
}
.auth-logo {
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 30px;
}
.warning-icon {
width: 70px;
height: 70px;
background: var(--danger-light);
color: var(--danger);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 2rem;
margin: 0 auto 25px;
}
.bilingual-text {
margin-bottom: 35px;
}
.bilingual-text h1 {
font-size: 1.5rem;
font-weight: 900;
color: var(--text-main);
margin-bottom: 10px;
}
.bilingual-text p {
font-size: 1.05rem;
color: var(--text-muted);
font-weight: 600;
}
.bilingual-text .en {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
direction: ltr;
font-size: 0.95rem;
margin-top: 15px;
padding-top: 15px;
border-top: 1px dashed var(--border);
}
.input-group {
position: relative;
margin-bottom: 25px;
text-align: right;
}
.input-group i {
position: absolute;
top: 50%;
right: 15px;
transform: translateY(-50%);
color: var(--text-muted);
font-size: 1.1rem;
}
.password-input {
width: 100%;
padding: 15px 45px 15px 15px;
border-radius: var(--radius);
border: 2px solid var(--border);
background: var(--bg-body);
color: var(--text-main);
font-family: inherit;
font-size: 1.05rem;
font-weight: 700;
outline: none;
transition: var(--transition);
direction: ltr;
text-align: left;
letter-spacing: 2px;
}
.password-input:focus {
border-color: var(--primary);
background: var(--bg-surface);
box-shadow: 0 0 0 4px var(--primary-light);
}
.btn-submit {
width: 100%;
background: var(--primary);
color: #ffffff;
border: 1px solid transparent;
padding: 15px;
border-radius: var(--radius);
font-family: inherit;
font-size: 1.1rem;
font-weight: 800;
cursor: pointer;
transition: var(--transition);
display: flex;
justify-content: center;
align-items: center;
gap: 10px;
}
.btn-submit:hover {
opacity: 0.9;
transform: translateY(-2px);
box-shadow: 0 10px 15px -3px rgba(15, 118, 110, 0.3);
}
.error-msg {
color: var(--danger);
background: var(--danger-light);
padding: 10px;
border-radius: var(--radius);
font-size: 0.9rem;
font-weight: 700;
margin-top: 15px;
display: none;
animation: shake 0.4s ease;
}
@keyframes slideUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-5px); }
50% { transform: translateX(5px); }
75% { transform: translateX(-5px); }
}
@media (max-width: 480px) {
.auth-card { padding: 35px 25px; }
.theme-toggle-wrapper { top: 15px; right: 15px; }
}
</style>
</head>
<body>

<div class="theme-toggle-wrapper">
<button class="icon-btn theme-toggle-btn" aria-label="Toggle Theme">
<i class="fa-solid fa-moon"></i>
</button>
</div>

<div class="auth-card">
<div class="auth-logo">
<img src="logo.png" class="logo-light" alt="GCI Logo" style="width: 150px; height: auto;">
<img src="logo-light.png" class="logo-dark" alt="GCI Logo" style="width: 150px; height: auto;">
</div>

<div class="warning-icon">
<i class="fa-solid fa-lock"></i>
</div>

<div class="bilingual-text">
<h1>تم حظر الوصول</h1>
<p>هذا الموقع مخصص للمطورين فقط.</p>
<div class="en">
<strong>Access Denied</strong><br>
This site is currentlyrestricted to developers only.
</div>
</div>

<div class="input-group">
<i class="fa-solid fa-key"></i>
<input type="password" id="devPassword" class="password-input" placeholder="Enter Developer Password">
</div>

<button class="btn-submit" id="loginBtn">
دخول / Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
</button>

<div class="error-msg" id="errorMsg">
كلمة المرور غير صحيحة / Incorrect Password
</div>
</div>

<script>
const themeBtns = document.querySelectorAll('.theme-toggle-btn');
const htmlEl = document.documentElement;
const currentTheme = localStorage.getItem('theme') || 'light';
htmlEl.setAttribute('data-theme', currentTheme);
updateIcons(currentTheme);

themeBtns.forEach(btn => {
btn.addEventListener('click', () => {
const newTheme = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
htmlEl.setAttribute('data-theme', newTheme);
localStorage.setItem('theme', newTheme);
updateIcons(newTheme);
});
});

function updateIcons(theme) {
themeBtns.forEach(btn => {
const icon = btn.querySelector('i');
if(theme === 'dark') {
icon.className = 'fa-solid fa-sun';
} else {
icon.className = 'fa-solid fa-moon';
}
});
}

const passwordInput = document.getElementById('devPassword');
const loginBtn = document.getElementById('loginBtn');
const errorMsg = document.getElementById('errorMsg');

function verifyAccess() {
const pass = passwordInput.value.trim();
if (pass === 'ZAD_GCI2026') {
window.location.href = 'intro.html';
} else {
errorMsg.style.display = 'block';
passwordInput.value = '';
passwordInput.focus();
setTimeout(() => {
errorMsg.style.display = 'none';
}, 3000);
}
}

loginBtn.addEventListener('click', verifyAccess);

passwordInput.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
verifyAccess();
}
});

document.addEventListener('contextmenu', event => event.preventDefault());

document.addEventListener('keydown', function(event) {
if (event.keyCode === 123) {
event.preventDefault();
}
if (event.ctrlKey && event.shiftKey && event.keyCode === 73) {
event.preventDefault();
}
if (event.ctrlKey && event.shiftKey && event.keyCode === 74) {
event.preventDefault();
}
if (event.ctrlKey && event.shiftKey && event.keyCode === 67) {
event.preventDefault();
}
if (event.ctrlKey && event.keyCode === 85) {
event.preventDefault();
}
});
</script>

</body>
</html>

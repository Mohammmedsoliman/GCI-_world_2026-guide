<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الصفحة غير موجودة - GCI 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--bg-body: #fafafa;
--bg-surface: #ffffff;
--text-main: #27272a;
--text-muted: #71717a;
--primary: #0f766e;
--primary-light: #ccfbf1;
--border: #e4e4e7;
--radius: 12px;
--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
--bg-body: #09090b;
--bg-surface: #18181b;
--text-main: #f4f4f5;
--text-muted: #a1a1aa;
--primary: #14b8a6;
--primary-light: rgba(20, 184, 166, 0.15);
--border: #27272a;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Cairo', sans-serif;
background-color: var(--bg-body);
color: var(--text-main);
line-height: 1.6;
display: flex;
flex-direction: column;
min-height: 100vh;
transition: background-color 0.3s, color 0.3s;
background-image: radial-gradient(var(--border) 1px, transparent 1px);
background-size: 40px 40px;
}
.logo-dark { display: none; }
[data-theme="dark"] .logo-light { display: none; }
[data-theme="dark"] .logo-dark { display: block; }
::selection { background-color: var(--primary); color: #ffffff; }
::-moz-selection { background-color: var(--primary); color: #ffffff; }
.top-navbar {
display: flex;
justify-content: space-between;
align-items: center;
background-color: var(--bg-surface);
padding: 15px 5%;
border-bottom: 1px solid var(--border);
position: sticky;
top: 0;
z-index: 900;
transition: background-color 0.3s;
}
.top-navbar .logo {
display: flex;
align-items: center;
}
.icon-btn {
background: var(--bg-body);
border: 1px solid var(--border);
color: var(--text-main);
width: 42px;
height: 42px;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.1rem;
transition: all 0.2s;
}
.icon-btn:hover {
background: var(--primary-light);
color: var(--primary);
border-color: var(--primary);
}
.main-content {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px 20px;
text-align: center;
}
.error-container {
animation: slideUp 0.5s ease;
max-width: 600px;
}
.error-code {
font-size: 8rem;
font-weight: 900;
line-height: 1;
color: var(--primary);
margin-bottom: 10px;
text-shadow: 0 10px 30px rgba(15, 118, 110, 0.2);
letter-spacing: 5px;
}
.error-title {
font-size: 2.2rem;
font-weight: 800;
color: var(--text-main);
margin-bottom: 15px;
}
.error-desc {
font-size: 1.1rem;
color: var(--text-muted);
margin-bottom: 35px;
font-weight: 600;
}
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 10px;
padding: 12px 30px;
border-radius: var(--radius);
font-weight: 800;
font-size: 1.1rem;
cursor: pointer;
transition: var(--transition);
text-decoration: none;
font-family: inherit;
}
.btn-primary {
background: var(--primary);
color: #ffffff;
border: 1px solid transparent;
}
.btn-primary:hover {
opacity: 0.9;
transform: translateY(-2px);
box-shadow: 0 10px 15px -3px rgba(15, 118, 110, 0.3);
}
@keyframes slideUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 768px) {
.error-code { font-size: 6rem; }
.error-title { font-size: 1.8rem; }
}
</style>
</head>
<body>

<header class="top-navbar">
<div class="logo">
<img src="logo.png" class="logo-light" alt="GCI Logo" style="width: 120px; height: 40px;">
<img src="logo-light.png" class="logo-dark" alt="GCI Logo" style="width: 120px; height: 40px;">
</div>
<div class="actions">
<button class="icon-btn theme-toggle-btn" aria-label="Toggle Theme">
<i class="fa-solid fa-moon"></i>
</button>
</div>
</header>

<main class="main-content">
<div class="error-container">
<div class="error-code">404</div>
<h1 class="error-title">عذراً، الصفحة غير موجودة</h1>
<p class="error-desc">يبدو أن الرابط الذي تحاول الوصول إليه غير صحيح، أو تم نقل الصفحة إلى مسار آخر. يمكنك العودة واستكمال مسار التعلم الخاص بك.</p>
<a href="index.html" class="btn btn-primary">
العودة للرئيسية <i class="fa-solid fa-house"></i>
</a>
</div>
</main>

<script>
const themeBtns = document.querySelectorAll('.theme-toggle-btn');
const htmlEl = document.documentElement;
const currentTheme = localStorage.getItem('theme') || 'light';
htmlEl.setAttribute('data-theme', currentTheme);
updateIcons(currentTheme);

themeBtns.forEach(btn => {
btn.addEventListener('click', () => {
const newTheme = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
htmlEl.setAttribute('data-theme', newTheme);
localStorage.setItem('theme', newTheme);
updateIcons(newTheme);
});
});

function updateIcons(theme) {
themeBtns.forEach(btn => {
const icon = btn.querySelector('i');
if(theme === 'dark') {
icon.className = 'fa-solid fa-sun';
} else {
icon.className = 'fa-solid fa-moon';
}
});
}
</script>

</body>
</html>
